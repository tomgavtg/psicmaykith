name: maykitpsic-development

services:
  web:
    build:
      context: .
      target: development
    init: true
    env_file:
      - .env.local
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - development_node_modules:/app/node_modules
      - development_next_cache:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "const socket=require('net').connect(3000,'127.0.0.1');socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 10s

volumes:
  development_node_modules:
  development_next_cache:
